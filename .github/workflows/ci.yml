name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.26.x'
      - run: go vet ./...
      - run: go test -race ./...
      - run: make cross
      - run: make build
      - run: ./regru version --output json
      - uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.12.2
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...
